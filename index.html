<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Parser</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    .form-section {
      margin-bottom: 20px;
    }
    input[type="number"] {
      width: 80px;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      border: 1px solid #ccc;
      max-height: 400px;
      overflow-y: scroll;
    }
  </style>
</head>
<body>
  <h1>PDF Parser</h1>

  <div class="form-section">
    <label for="file">Choose PDF: </label>
    <input type="file" id="file" accept="application/pdf" />
  </div>

  <div class="form-section">
    <label for="start">Start Page: </label>
    <input type="number" id="start" value="1" min="1" />
    <label for="end">End Page: </label>
    <input type="number" id="end" value="10" min="1" />
  </div>

  <button id="uploadBtn">Parse PDF</button>

  <h2>Results</h2>
  <pre id="output">No data yet...</pre>

  <script>
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const fileInput = document.getElementById("file");
      const startPage = document.getElementById("start").value;
      const endPage = document.getElementById("end").value;

      if (!fileInput.files.length) {
        alert("Please select a PDF file first.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("start_page", startPage);
      formData.append("end_page", endPage);

      try {
        const res = await fetch("http://127.0.0.1:5000/parse-pdf", {
          method: "POST",
          body: formData
        });

        const data = await res.json();
        document.getElementById("output").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("output").textContent = "Error: " + err;
      }
    });
  </script>
</body>
</html>
